name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end flow
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm preview > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/portfolio/ > /dev/null && break; sleep 1; done
          pnpm test:e2e

      - name: Lighthouse (performance and accessibility 95+)
        run: pnpm lighthouse

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/output/
          if-no-files-found: ignore
